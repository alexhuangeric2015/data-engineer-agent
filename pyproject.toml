[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-engineer-agent"
version = "0.2.0"
description = "面向 HiAgent 的 FastAPI 与 MCP 数据字典查询服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.0,<2.0.0",
    "fastapi>=0.119.0,<1.0.0",
    "mcp>=2.0.0,<3.0.0",
    "pgvector>=0.4.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.37.0,<1.0.0",
]

[project.scripts]
data-dictionary-service = "data_engineer_agent.server:main"
# 兼容已经使用旧命令的本地环境；两个命令启动同一个统一服务。
data-dictionary-mcp = "data_engineer_agent.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "pytest-cov>=6.2.0,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_engineer_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=data_engineer_agent", "--cov-report=term-missing"]
markers = [
    "integration: 需要本地 PostgreSQL 的集成测试",
    "unit: 不依赖外部服务的快速单元测试",
]

[tool.coverage.run]
branch = true
source = ["data_engineer_agent"]
