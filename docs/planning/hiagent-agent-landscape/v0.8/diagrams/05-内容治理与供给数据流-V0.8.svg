<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1500" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">内容治理与供给数据流</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">源资料经过治理与责任确认，形成知识检索与资产事实查询两类消费载体。</text><text x="48" y="1472.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1472.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">治理与协同版 V0.8</text><rect x="48" y="190" width="590" height="900" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="70" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">来源与权威维护</text><rect x="790" y="190" width="780" height="900" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="812" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">治理、加工与验证</text><rect x="1722" y="190" width="630" height="900" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="1744" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">服务消费载体</text><rect x="70" y="290" width="546" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="312" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="107" y="326.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">资产与业务资料</text><text x="95" y="416.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">表字段 / 字典码值 / 业务说明</text><text x="95" y="448.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">规范、指标定义与历史项目成果</text><rect x="70" y="735" width="546" height="225" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="757" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="107" y="771.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">业务与数据责任方</text><text x="95" y="859.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">口径、映射、敏感信息与冲突复核</text><text x="95" y="890.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">已有资产持续维护，变更保留来源</text><rect x="812" y="290" width="736" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="830" y="312" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="849" y="326.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">清洗校验与语义补全</text><text x="837" y="416.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">盘点 → 去重校验 → 标准映射 → 语义候选</text><text x="837" y="448.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">AI辅助生成，责任人确认后形成受控内容</text><rect x="812" y="735" width="736" height="225" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="830" y="757" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="849" y="771.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">加工、写入与可用性核验</text><text x="837" y="859.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">根据目标知识库、路径和写入配置更新</text><text x="837" y="890.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">形成结构化数据；验证记录、版本和检索结果</text><rect x="1744" y="290" width="586" height="230" rx="12" fill="#F3EFFA" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1762" y="312" width="5" height="27" rx="2" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="1781" y="326.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#7653A8" font-weight="700">知识文件与检索索引</text><text x="1769" y="416.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">表结构知识 / 字典知识 / 业务语义</text><text x="1769" y="448.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">用途：定位候选与对象标识</text><rect x="1744" y="735" width="586" height="225" rx="12" fill="#E6F5F0" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1762" y="757" width="5" height="27" rx="2" fill="#087E72" stroke="#087E72" stroke-width="1.3"/><text x="1781" y="771.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#087E72" font-weight="700">外部结构化查询数据</text><text x="1769" y="859.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">治理后的表字段、字典类型与码值</text><text x="1769" y="890.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">用途：核验实际事实并返回明细</text><path d="M 620,405 L 808,405" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 620,848 L 700,848 L 700,475 L 808,475" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1180,524 L 1180,731" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1552,848 L 1648,848 L 1648,405 L 1740,405" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1648,848 L 1740,848" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="48.0" y="1140" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="1162" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1176.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">当前建设</text><text x="73.0" y="1245.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">知识准备与外部查询数据准备同步开展。</text><text x="73.0" y="1277.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">不因此宣称已经具备每日调度、正式上线或完成验收。</text><rect x="1212.0" y="1140" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="1162" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1176.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">更新闭环</text><text x="1237.0" y="1245.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">源变更、查询失败和用户反馈进入内容治理。</text><text x="1237.0" y="1277.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">知识和事实副本关联来源版本，更新后回归真实问题。</text></g></svg>