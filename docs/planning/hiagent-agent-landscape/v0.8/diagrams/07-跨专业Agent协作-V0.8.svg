<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1640" viewBox="0 0 2400 1640"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1640" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">数据智能体协同关系｜专业 Agent 按需引用</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">同级专业角色按任务需要相互引用；接受任务的专业 Agent 规划步骤、组织调用并汇总成果。</text><text x="48" y="1612.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1612.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">规划优化版 V0.8</text><rect x="48" y="186" width="2304" height="208" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><text x="72" y="214.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">专业角色布局｜以下协作示例均复用这九种角色</text><rect x="72" y="252" width="1060" height="120" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="87" y="272" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="103" y="284.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">数据生产类 · 5 种</text><text x="96" y="335.0" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">数据需求分析 / 数据设计 / 数据开发 / 数据测试 / 数据评审</text><rect x="1148" y="252" width="720" height="120" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1163" y="272" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1179" y="284.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">数据运营类 · 3 种</text><text x="1172" y="335.0" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">数据资产（当前建设） / 数据运维 / 数据治理</text><rect x="1884" y="252" width="444" height="120" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1899" y="272" width="4" height="25" rx="2" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="1915" y="284.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#7653A8" font-weight="700">分析挖掘类 · 1 种</text><text x="1908" y="335.0" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">数据分析</text><rect x="48" y="436" width="752" height="850" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="48" y="436" width="752" height="78" rx="12" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="72" y="474.0" dominant-baseline="central" text-anchor="start" font-size="28" fill="#FFFFFF" font-weight="700">场景 A · 数据研发任务</text><rect x="72" y="544" width="704" height="105" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="424.0" y="571.0" dominant-baseline="central" text-anchor="middle" font-size="25" fill="#2861B5" font-weight="700">数据开发 Agent 主导本次任务</text><text x="424.0" y="615.5" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#60758C" font-weight="400">依据提示词 / SKILL 理解目标、规划步骤</text><text x="78" y="687.0" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="700">按需引用专业 Agent 或调用工具</text><path d="M 424,651 L 424,666" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="72" y="726" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="87" y="746" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="103" y="758.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">需求 / 设计 Agent</text><text x="96" y="797.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">澄清需求口径，补齐模型与加工设计</text><rect x="72" y="841" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="87" y="861" width="4" height="25" rx="2" fill="#087E72" stroke="#087E72" stroke-width="1.3"/><text x="103" y="873.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#087E72" font-weight="700">数据资产 Agent</text><text x="96" y="912.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">查询表字段与字典，理解可用资产</text><rect x="72" y="956" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="87" y="976" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="103" y="988.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">测试 / 评审 Agent</text><text x="96" y="1027.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">辅助测试验证、检查规范和交付成果</text><text x="78" y="1097.0" dominant-baseline="central" text-anchor="start" font-size="19" fill="#60758C" font-weight="400">引用对象与次数按任务决定，列表不表示固定顺序。</text><rect x="72" y="1143" width="704" height="111" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="424.0" y="1181.96" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">开发 Agent 汇总代码、验证与评审结果</text><text x="424.0" y="1213.04" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">由相关人员确认关键方案与交付成果</text><rect x="824" y="436" width="752" height="850" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="824" y="436" width="752" height="78" rx="12" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="848" y="474.0" dominant-baseline="central" text-anchor="start" font-size="28" fill="#FFFFFF" font-weight="700">场景 B · 专题分析任务</text><rect x="848" y="544" width="704" height="105" rx="12" fill="#F3EFFA" stroke="#D7E1ED" stroke-width="1.3"/><text x="1200.0" y="571.0" dominant-baseline="central" text-anchor="middle" font-size="25" fill="#7653A8" font-weight="700">数据分析 Agent 主导本次任务</text><text x="1200.0" y="615.5" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#60758C" font-weight="400">依据提示词 / SKILL 理解目标、规划步骤</text><text x="854" y="687.0" dominant-baseline="central" text-anchor="start" font-size="22" fill="#7653A8" font-weight="700">按需引用专业 Agent 或调用工具</text><path d="M 1200,651 L 1200,666" fill="none" stroke="#7653A8" stroke-width="2" marker-end="url(#7653A8)"/><rect x="848" y="726" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="863" y="746" width="4" height="25" rx="2" fill="#087E72" stroke="#087E72" stroke-width="1.3"/><text x="879" y="758.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#087E72" font-weight="700">数据资产 Agent</text><text x="872" y="797.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">查找数据、字段含义与代码口径</text><rect x="848" y="841" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="863" y="861" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="879" y="873.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">数据治理 Agent · 按需</text><text x="872" y="912.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">辅助核对标准与口径，识别质量问题</text><rect x="848" y="956" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="863" y="976" width="4" height="25" rx="2" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="879" y="988.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#7653A8" font-weight="700">分析工具 / 平台接口</text><text x="872" y="1027.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">执行计算；需要血缘时调用数据资产平台</text><text x="854" y="1097.0" dominant-baseline="central" text-anchor="start" font-size="19" fill="#60758C" font-weight="400">引用对象与次数按任务决定，列表不表示固定顺序。</text><rect x="848" y="1143" width="704" height="111" rx="12" fill="#F3EFFA" stroke="#D7E1ED" stroke-width="1.3"/><text x="1200.0" y="1181.96" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#7653A8" font-weight="700">分析 Agent 汇总数据依据与分析结论</text><text x="1200.0" y="1213.04" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#7653A8" font-weight="700">由相关人员复核洞察、假设与行动建议</text><rect x="1600" y="436" width="752" height="850" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1600" y="436" width="752" height="78" rx="12" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1624" y="474.0" dominant-baseline="central" text-anchor="start" font-size="28" fill="#FFFFFF" font-weight="700">场景 C · 治理与运营任务</text><rect x="1624" y="544" width="704" height="105" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="1976.0" y="571.0" dominant-baseline="central" text-anchor="middle" font-size="25" fill="#2861B5" font-weight="700">数据治理 Agent 主导本次任务</text><text x="1976.0" y="615.5" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#60758C" font-weight="400">依据提示词 / SKILL 理解目标、规划步骤</text><text x="1630" y="687.0" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="700">按需引用专业 Agent 或调用工具</text><path d="M 1976,651 L 1976,666" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1624" y="726" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1639" y="746" width="4" height="25" rx="2" fill="#087E72" stroke="#087E72" stroke-width="1.3"/><text x="1655" y="758.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#087E72" font-weight="700">数据资产 Agent</text><text x="1648" y="797.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">核对资产资料，定位缺失与冲突</text><rect x="1624" y="841" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1639" y="861" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1655" y="873.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">数据运维 Agent · 按需</text><text x="1648" y="912.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">补充运行状态、时效与异常线索</text><rect x="1624" y="956" width="704" height="97" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1639" y="976" width="4" height="25" rx="2" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="1655" y="988.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#7653A8" font-weight="700">治理工具 / 平台接口</text><text x="1648" y="1027.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">执行资料检查；通过资产平台追溯血缘</text><text x="1630" y="1097.0" dominant-baseline="central" text-anchor="start" font-size="19" fill="#60758C" font-weight="400">引用对象与次数按任务决定，列表不表示固定顺序。</text><rect x="1624" y="1143" width="704" height="111" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="1976.0" y="1181.96" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">治理 Agent 汇总问题、依据与整改建议</text><text x="1976.0" y="1213.04" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">经责任人确认后维护资产、规则与知识</text><rect x="48" y="1316" width="2304" height="170" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><text x="72" y="1345.0" dominant-baseline="central" text-anchor="start" font-size="24" fill="#2861B5" font-weight="700">共享基础与反馈｜按同一资产事实、业务口径与规则协作，发现的问题经责任确认后反馈治理</text><rect x="72" y="1382" width="740" height="87" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="87" y="1402" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="103" y="1414.5" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="700">治理后的资产与知识</text><text x="96" y="1448.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">表字段 / 字典码值 / 标准口径 / 经验案例</text><rect x="830" y="1382" width="740" height="87" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="845" y="1402" width="4" height="25" rx="2" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="861" y="1414.5" dominant-baseline="central" text-anchor="start" font-size="22" fill="#7653A8" font-weight="700">血缘与影响依据</text><text x="854" y="1448.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">Agent → 工具或接口 → 数据资产平台 → 血缘事实</text><rect x="1588" y="1382" width="740" height="87" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1603" y="1402" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1619" y="1414.5" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="700">持续治理与内容维护</text><text x="1612" y="1448.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">资料校验 / 语义补全 / 责任确认 / 更新复用</text><rect x="48" y="1512" width="2304" height="63" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="1200.0" y="1543.0" dominant-baseline="central" text-anchor="middle" font-size="22" fill="#FFFFFF" font-weight="700">协作原则：专业 Agent 可相互引用  /  任务规划归于 Agent 内部  /  工具提供执行能力  /  人员确认关键成果</text></g></svg>