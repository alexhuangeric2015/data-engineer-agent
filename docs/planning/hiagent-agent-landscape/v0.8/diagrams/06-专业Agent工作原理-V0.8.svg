<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1500" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">专业Agent工作原理与资源引用</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">任务规划属于专业Agent内部；SKILL定义方法，资源引用与实际调用由Agent组织。</text><text x="48" y="1472.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1472.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">治理与协同版 V0.8</text><rect x="720" y="190" width="960" height="125" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="738" y="212" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="757" y="226.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">业务请求与任务上下文</text><text x="745" y="280.0" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">目标、已确认对象、用户身份、范围与约束</text><rect x="650" y="430" width="1100" height="270" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><rect x="668" y="452" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="687" y="466.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">主导本次任务的专业Agent</text><text x="675" y="576.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">理解目标 → 规划步骤 → 选择资源与专业协作</text><text x="675" y="608.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">调用与观察 → 核验调整 → 汇总成果、依据与缺口</text><rect x="48" y="450" width="510" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="472" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="486.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">提示词与SKILL</text><text x="73" y="576.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">角色 / 任务方法 / 判断条件</text><text x="73" y="608.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">证据要求 / 确认节点 / 异常处理</text><rect x="1844" y="450" width="508" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1862" y="472" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1881" y="486.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">同级专业Agent</text><text x="1869" y="576.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">资产 / 设计 / 开发 / 测试 / 评审等</text><text x="1869" y="608.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">按需参与，返回专业结果与证据</text><path d="M 1200,319 L 1200,426" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 646,565 L 562,565" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1754,565 L 1840,565" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="48" y="880" width="752" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="902" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="916.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">知识库与企业语义</text><text x="73" y="1006.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">候选检索 / 指标口径 / 规范 / 方法</text><text x="73" y="1038.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">保留来源、版本与适用范围</text><path d="M 1200,704 L 1200,795 L 424,795 L 424,876" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="824" y="880" width="752" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="842" y="902" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="861" y="916.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">结构化事实与平台API</text><text x="849" y="1006.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">当前资产查询库：表字段、字典码值</text><text x="849" y="1038.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">资产平台：目录、指标及实际血缘</text><path d="M 1200,704 L 1200,795 L 1200,795 L 1200,876" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1600" y="880" width="752" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1618" y="902" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1637" y="916.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">执行与验证工具</text><text x="1625" y="1006.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">计算 / 调试 / 质量检查 / 静态检查</text><text x="1625" y="1038.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">操作在原平台按授权范围执行</text><path d="M 1200,704 L 1200,795 L 1976,795 L 1976,876" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="48.0" y="1160" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="1182" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1196.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">协作原则</text><text x="73.0" y="1265.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">专业角色可以主导任务，也可被其他Agent引用。</text><text x="73.0" y="1297.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">不新增必选全局协调Agent，不把角色数量固定为实例数量。</text><rect x="1212.0" y="1160" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="1182" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1196.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">成果要求</text><text x="1237.0" y="1265.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">引用实际结果，区分事实、假设和待确认事项。</text><text x="1237.0" y="1297.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">权限及发布等硬性控制在执行平台落实。</text></g></svg>