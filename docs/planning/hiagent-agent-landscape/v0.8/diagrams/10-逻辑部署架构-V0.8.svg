<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1520" viewBox="0 0 2400 1520"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1520" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">逻辑部署架构与访问边界</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">规划视图：只表达逻辑归属和访问路径，实际网络、模型位置和服务器规格另行确认。</text><text x="48" y="1492.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1492.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">