0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">HiAgent</text><text x="687" y="481.42" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">专业Agent / 会话</text><text x="687" y="512.5" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">知识库与检索</text><text x="687" y="543.58" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">资源引用与工具接入</text><rect x="1157" y="330" width="491" height="310" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1175" y="352" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1194" y="366.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">平台接入服务</text><text x="1182" y="481.42" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">接口适配 / 身份与权限</text><text x="1182" y="512.5" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">调用审计 / 状态与异常</text><text x="1182" y="543.58" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">结果与版本核对</text><rect x="662" y="815" width="465" height="250" rx="12" fill="#E6F5F0" stroke="#D7E1ED" stroke-width="1.3"/><rect x="680" y="837" width="5" height="27" rx="2" fill="#087E72" stroke="#087E72" stroke-width="1.3"/><text x="699" y="851.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#087E72" font-weight="700">外部资产查询数据</text><text x="687" y="951.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">治理后的表字段 / 字典码值</text><text x="687" y="983.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">经HiAgent外部接入查询</text><rect x="1157" y="815" width="491" height="250" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1175" y="837" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1194" y="851.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">模型服务依赖</text><text x="1182" y="951.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">经批准的模型访问路径</text><text x="1182" y="983.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">物理位置以实际条件确定</text><rect x="1854" y="330" width="476" height="310" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1872" y="352" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1891" y="366.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">开发 / 资产 / 调度</text><text x="1879" y="481.42" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">原平台服务与操作入口</text><text x="1879" y="512.5" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">权威定义与原身份</text><text x="1879" y="543.58" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">原有发布、运行与执行控制</text><rect x="1854" y="815" width="476" height="250" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1872" y="837" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1891" y="851.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">质量 / 血缘 / 计算</text><text x="1879" y="951.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">平台事实与专业执行工具</text><text x="1879" y="983.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">血缘由资产平台统一提供</text><path d="M 482,605 L 636,605" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1131,485 L 1153,485" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1674,485 L 1828,485" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 894,644 L 894,811" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1127,600 L 1140,600 L 1140,730 L 1402,730 L 1402,811" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 2092,644 L 2092,811" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="48.0" y="1225" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="1247" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1261.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">部署原则</text><text x="73.0" y="1330.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">验证与生产环境隔离；跨区域访问受控；权限实际执行。</text><text x="73.0" y="1362.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">不预设云上、私有化或混合部署，也不声称已投产。</text><rect x="1212.0" y="1225" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="1247" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1261.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">组件复用</text><text x="1237.0" y="1330.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">平台接入服务是逻辑职责，可复用已有接入能力。</text><text x="1237.0" y="1362.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">查询数据库保存资产事实，不是全量业务数仓副本。</text></g></svg>