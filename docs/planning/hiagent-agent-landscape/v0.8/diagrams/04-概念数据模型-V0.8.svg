<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1580" viewBox="0 0 2400 1580"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1580" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">企业语义与资产概念数据模型</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">表达逻辑关系与权威归属；不把概念实体等同新增物理表，不把字典映射当成加工血缘。</text><text x="48" y="1552.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1552.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">治理与协同版 V0.8</text><rect x="48" y="210" width="570" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="232" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="246.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">业务术语</text><text x="73" y="336.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">名称 / 同义词 / 业务释义</text><text x="73" y="368.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">用于解释指标、资产与业务对象</text><rect x="914" y="210" width="570" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="932" y="232" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="951" y="246.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">指标定义</text><text x="939" y="336.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">公式 / 粒度 / 维度 / 条件</text><text x="939" y="368.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">责任、审核、生效范围与版本</text><rect x="1782" y="210" width="570" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1800" y="232" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1819" y="246.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">分析维度</text><text x="1807" y="336.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">机构 / 客群 / 时间 / 币种等</text><text x="1807" y="368.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">定义指标支持的分析约束</text><rect x="48" y="610" width="570" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="632" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="646.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">表与字段</text><text x="73" y="736.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">对象标识 / 数据类型 / 所属关系</text><text x="73" y="768.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">业务描述、更新时点与来源</text><rect x="914" y="610" width="570" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="932" y="632" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="951" y="646.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">实现映射</text><text x="939" y="736.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">指标或业务定义 → SQL / API / 表字段</text><text x="939" y="768.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">适用范围、关联粒度、验证状态</text><rect x="1782" y="610" width="570" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1800" y="632" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1819" y="646.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">责任与版本</text><text x="1807" y="736.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">责任人 / 审核状态 / 生效期</text><text x="1807" y="768.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">关联定义与实现，保持可追溯</text><rect x="48" y="1010" width="570" height="220" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="1032" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="1046.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">字典类型与码值</text><text x="73" y="1131.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">原始码值 / 释义 / 字典映射</text><text x="73" y="1163.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">字符串原值保留，不静默合并冲突</text><rect x="914" y="1010" width="570" height="220" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="932" y="1032" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="951" y="1046.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">规则、质量与血缘引用</text><text x="939" y="1131.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">约束、检查结果、依赖证据</text><text x="939" y="1163.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">记录权威来源、覆盖范围与采集时点</text><rect x="1782" y="1010" width="570" height="220" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1800" y="1032" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1819" y="1046.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">实际血缘来源</text><text x="1807" y="1131.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">由数据资产平台统一查询</text><text x="1807" y="1163.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">可汇聚底层血缘工具真实解析结果</text><path d="M 622,325 L 910,325" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1488,325 L 1778,325" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1199,444 L 1199,606" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 910,725 L 622,725" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1488,725 L 1778,725" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 333,844 L 333,1006" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1199,844 L 1199,1006" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1488,1120 L 1778,1120" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="48.0" y="1300" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="1322" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1336.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">模型用途</text><text x="73.0" y="1405.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">支撑检索消歧、口径复用、实现选择与成果追溯。</text><text x="73.0" y="1437.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">具体字段与存储形态按现有平台盘点后确定。</text><rect x="1212.0" y="1300" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="1322" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1336.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">权威边界</text><text x="1237.0" y="1405.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">业务语义、物理映射、质量与实际血缘分别管理。</text><text x="1237.0" y="1437.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">知识库保存消费索引，不替代权威定义和实时平台事实。</text></g></svg>