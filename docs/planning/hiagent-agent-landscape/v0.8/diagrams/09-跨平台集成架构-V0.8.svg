<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1560" viewBox="0 0 2400 1560"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1560" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">跨平台集成架构</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">按任务定义请求与响应契约，明确平台事实、实际执行和治理反馈的分工。</text><text x="48" y="1532.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1532.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">治理与协同版 V0.8</text><rect x="48" y="190" width="570" height="1000" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="70" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">智能服务与内容运营</text><rect x="770" y="190" width="720" height="1000" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="792" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">服务适配与调用控制</text><rect x="1642" y="190" width="710" height="1000" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="1664" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">既有系统与平台</text><rect x="70" y="300" width="526" height="240" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="322" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="107" y="336.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">专业Agent</text><text x="95" y="431.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">对象与任务参数 / 用户身份</text><text x="95" y="463.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">组织调用、核验结果与解释成果</text><rect x="70" y="825" width="526" height="240" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="847" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="107" y="861.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">内容维护与评测运营</text><text x="95" y="956.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">源版本更新 / 消费与失败反馈</text><text x="95" y="988.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">检索索引、事实准备与任务回归</text><rect x="792" y="300" width="676" height="765" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><rect x="810" y="322" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="829" y="336.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">接口契约与平台适配</text><text x="817" y="616.76" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">请求：对象标识、身份、操作与范围</text><text x="817" y="647.84" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400"></text><text x="817" y="678.92" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">返回：结果、来源、版本、状态与时点</text><text x="817" y="710.0" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400"></text><text x="817" y="741.0799999999999" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">控制：权限、异常、超时与关键确认</text><text x="817" y="772.16" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400"></text><text x="817" y="803.24" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">接入：API / 适配工具；MCP按条件采用</text><rect x="1664" y="300" width="666" height="239" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1682" y="322" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1701" y="336.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">数据资产平台</text><text x="1689" y="431.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">目录 / 指标 / 元数据 / 实际血缘</text><text x="1689" y="462.53999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">汇聚底层血缘解析工具</text><path d="M 1494,420 L 1638,420" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1664" y="563" width="666" height="239" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1682" y="585" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1701" y="599.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">开发与质量平台</text><text x="1689" y="694.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">代码草稿 / 调试 / 质量检查</text><text x="1689" y="725.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">原发布审批与测试证据</text><path d="M 1494,683 L 1638,683" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1664" y="826" width="666" height="239" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1682" y="848" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1701" y="862.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">数据调度平台</text><text x="1689" y="957.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">任务实例 / 状态 / 日志 / 依赖</text><text x="1689" y="988.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">原平台执行受控处置</text><path d="M 1494,946 L 1638,946" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 622,420 L 766,420" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 622,945 L 766,945" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="48.0" y="1250" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="1272" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1286.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">统一身份与执行边界</text><text x="73.0" y="1355.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">权限在实际访问链路、网关、引擎和执行平台强制落实。</text><text x="73.0" y="1387.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">资产对象授权不自动替代行列权限和生产操作授权。</text><rect x="1212.0" y="1250" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="1272" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1286.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">来源与失败处理</text><text x="1237.0" y="1355.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">调用与响应沿同一链路；保留异常、结果和操作状态。</text><text x="1237.0" y="1387.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">源变更和失败反馈推动治理，不直接覆盖权威定义。</text></g></svg>