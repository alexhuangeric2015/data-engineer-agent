e-width="1.3"/><text x="309" y="416.44" dominant-baseline="central" text-anchor="start" font-size="22" fill="#087E72" font-weight="400">建设数据资产智能体</text><text x="309" y="449.0" dominant-baseline="central" text-anchor="start" font-size="22" fill="#087E72" font-weight="400">表、字段、字典与码值查询</text><text x="309" y="481.56" dominant-baseline="central" text-anchor="start" font-size="22" fill="#087E72" font-weight="400">候选确认、事实核验与连续追问</text><rect x="980" y="359" width="676" height="180" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="1005" y="416.44" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="400">按价值与基础选择开发、评审、分析等场景</text><text x="1005" y="449.0" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="400">扩展相应专业 Agent 与 SKILL</text><text x="1005" y="481.56" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="400">各 Agent 可独立规划、按需引用其他 Agent</text><rect x="1676" y="359" width="676" height="180" rx="12" fill="#F3EFFA" stroke="#D7E1ED" stroke-width="1.3"/><text x="1701" y="416.44" dominant-baseline="central" text-anchor="start" font-size="22" fill="#7653A8" font-weight="400">逐步覆盖三类九种专业角色</text><text x="1701" y="449.0" dominant-baseline="central" text-anchor="start" font-size="22" fill="#7653A8" font-weight="400">扩大跨角色任务中的按需协作</text><text x="1701" y="481.56" dominant-baseline="central" text-anchor="start" font-size="22" fill="#7653A8" font-weight="400">保留专业分工与人工确认</text><rect x="48" y="559" width="220" height="180" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="158.0" y="593.0" dominant-baseline="central" text-anchor="middle" font-size="23" fill="#FFFFFF" font-weight="700">数据与知识治理</text><text x="158.0" y="661.42" dominant-baseline="central" text-anchor="middle" font-size="17" fill="#C4D4E8" font-weight="400">从当前阶段开始</text><text x="158.0" y="686.5799999999999" dominant-baseline="central" text-anchor="middle" font-size="