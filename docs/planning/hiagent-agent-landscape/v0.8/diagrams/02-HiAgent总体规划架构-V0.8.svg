size="20" fill="#2861B5" font-weight="700">数据运维</text><text x="1108.0" y="524.8" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#2861B5" font-weight="700">智能体</text><text x="1108.0" y="562.0" dominant-baseline="central" text-anchor="middle" font-size="15" fill="#60758C" font-weight="400">后续规划</text><rect x="1197" y="471" width="160" height="113" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><text x="1277.0" y="495.2" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#2861B5" font-weight="700">数据治理</text><text x="1277.0" y="524.8" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#2861B5" font-weight="700">智能体</text><text x="1277.0" y="562.0" dominant-baseline="central" text-anchor="middle" font-size="15" fill="#60758C" font-weight="400">后续规划</text><rect x="1390" y="412" width="386" height="194" rx="12" fill="#F3F6FA" stroke="#D7E1ED" stroke-width="1.3"/><text x="1407" y="437.0" dominant-baseline="central" text-anchor="start" font-size="22" fill="#7653A8" font-weight="700">分析挖掘类 · 1 种</text><rect x="1406" y="471" width="354" height="113" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1421" y="491" width="4" height="25" rx="2" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="1437" y="503.5" dominant-baseline="central" text-anchor="start" font-size="22" fill="#7653A8" font-weight="700">数据分析智能体</text><text x="1430" y="550.5" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">分析 / 挖掘 / 洞察</text><rect x="88" y="626" width="1688" height="68" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="932.0" y="647.5" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">各专业 Agent 内部：理解需求 → 任务规划 → 按需引用其他 Agent / 调用工具 → 核验与汇总 → 人工确认</text><text x="932.0" y="677.0" dominant-baseline="central" text-anchor="middle" font-size="16" fill="#60758C" font-weight="400">提示词与 SKILL 约束方法，Agent 负责规划与实际调用；按场景组织协作。</text><text x="80" y="756.5" dominant-baseline="central" text-anchor="start" font-size="24" fill="#2861B5" font-weight="700">Agent 引用的规则、知识、数据与工具</text><rect x="72" y="794" width="418" height="165" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="87" y="814" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="103" y="826.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">提示词与 SKILL</text><text x="96" y="886.92" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">角色职责 / 任务方法</text><text x="96" y="912.0799999999999" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">查询、设计、测试与评审规则</text><rect x="506" y="794" width="418" height="165" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="521" y="814" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="537" y="826.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">知识库</text><text x="530" y="886.92" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">当前：表结构与字典知识</text><text x="530" y="912.0799999999999" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">扩展：语义、规范与案例</text><rect x="940" y="794" width="418" height="165" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="955" y="814" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="971" y="826.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#2861B5" font-weight="700">查询数据库 · 外部接入</text><text x="964" y="886.92" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">治理后的表字段、字典码值</text><text x="964" y="912.0799999999999" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">核验资产事实及返回明细</text><rect x="1374" y="794" width="418" height="165" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1389" y="814" width="4" height="25" rx="2" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="1405" y="826.5" dominant-baseline="central" text-anchor="start" font-size="23" fill="#7653A8" font-weight="700">工具与平台接口</text><text x="1398" y="886.92" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">血缘平台调用 / SQL 检查</text><text x="1398" y="912.0799999999999" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">数据计算 / 图表与文档生成</text><text x="930.0" y="982.0" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#60758C" font-weight="400">知识库定位候选 → 外部查询数据库核验事实；资源引用由 Agent 发起，血缘按需调用数据资产平台。</text><rect x="72" y="1012" width="1720" height="92" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="88" y="1033.5" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="700">HiAgent 平台能力复用</text><text x="932.0" y="1074.0" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#2861B5" font-weight="400">Agent 配置  /  资源引用与 Agent 间调用  /  会话与交互  /  知识库检索  /  数据库及工具接入</text><rect x="1850" y="328" width="502" height="300" rx="12" fill="#F2EDF9" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1865" y="348" width="4" height="25" rx="2" fill="#7653A8" stroke="#7653A8" stroke-width="1.3"/><text x="1881" y="360.5" dominant-baseline="central" text-anchor="start" font-size="25" fill="#7653A8" font-weight="700">数据资产平台</text><text x="1874" y="450.68" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">血缘查询与实际血缘结果</text><text x="1874" y="475.84000000000003" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">上游追溯 / 下游影响分析</text><text x="1874" y="501.0" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400"></text><text x="1874" y="526.16" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">Agent 经工具或接口按需调用</text><text x="1874" y="551.32" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">结果保留来源与覆盖范围</text><rect x="1850" y="658" width="502" height="270" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1865" y="678" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1881" y="690.5" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">已有数据与知识来源</text><text x="1874" y="765.68" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">表字段资料 / 字典与码值</text><text x="1874" y="790.8399999999999" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">业务说明 / 标准规范 / 历史成果</text><text x="1874" y="816.0" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400"></text><text x="1874" y="841.16" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">已有资产持续治理与更新</text><text x="1874" y="866.3199999999999" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">治理结果用于知识与查询数据建设</text><rect x="1850" y="958" width="502" height="166" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1865" y="978" width="4" height="25" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1881" y="990.5" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">其他企业系统</text><text x="1874" y="1051.42" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">数据开发 / 治理 / 调度 / 分析平台</text><text x="1874" y="1076.5800000000002" dominant-baseline="central" text-anchor="start" font-size="17" fill="#60758C" font-weight="400">业务系统 / 数据仓库等</text><path d="M 1792,877 L 1832,877 L 1832,480 L 1847,480" fill="none" stroke="#7653A8" stroke-width="2" marker-end="url(#7653A8)"/><text x="1786" y="768.0" dominant-baseline="central" text-anchor="end" font-size="17" fill="#7653A8" font-weight="700">血缘能力由外部平台提供</text><rect x="48" y="1154" width="2304" height="230" rx="12" fill="#FFFFFF" stroke="#2861B5" stroke-width="1.3"/><text x="72" y="1184.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">基础建设与持续维护｜治理已有资产和知识，形成可查询、可检索、可追溯的可信内容</text><rect x="72" y="1231" width="382" height="61" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="263.0" y="1261.5" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">收集已有资产</text><path d="M 459,1261 L 475,1261" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="480" y="1231" width="382" height="61" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="671.0" y="1261.5" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">清洗与一致性校验</text><path d="M 867,1261 L 883,1261" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="888" y="1231" width="382" height="61" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="1079.0" y="1261.5" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">标准映射与语义补全</text><path d="M 1275,1261 L 1291,1261" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1296" y="1231" width="382" height="61" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><text x="1487.0" y="1261.5" dominant-baseline="central" text-anchor="middle" font-size="21" fill="#2861B5" font-weight="700">责任确认与更新</text><rect x="1720" y="1221" width="608" height="88" rx="12" fill="#E6F5F0" stroke="#B9DCD3" stroke-width="1.3"/><text x="2024.0" y="1244.0" dominant-baseline="central" text-anchor="middle" font-size="22" fill="#087E72" font-weight="700">治理成果 → 知识库内容 / 外部查询数据</text><text x="2024.0" y="1282.5" dominant-baseline="central" text-anchor="middle" font-size="18" fill="#60758C" font-weight="400">由配套程序加工、写入和校验，持续维护</text><path d="M 1679,1261 L 1715,1261" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><text x="1200.0" y="1344.0" dominant-baseline="central" text-anchor="middle" font-size="20" fill="#60758C" font-weight="400">治理基础工作同步开展；数据治理 Agent 是后续辅助角色。血缘事实通过平台查询获取，保留原始来源。</text><rect x="48" y="1410" width="2304" height="77" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="1200.0" y="1437.5" dominant-baseline="central" text-anchor="middle" font-size="23" fill="#FFFFFF" font-weight="700">贯穿保障：身份权限  /  数据与知识质量  /  调用审计与成果追溯  /  内容运营  /  人工确认与责任</text><text x="1200.0" y="1470.0" dominant-baseline="central" text-anchor="middle" font-size="16" fill="#C4D4E8" font-weight="400">规划职责不代表均已部署；当前建设聚焦数据资产查询及资料治理，后续能力按业务价值和平台条件扩展。</text></g></svg>