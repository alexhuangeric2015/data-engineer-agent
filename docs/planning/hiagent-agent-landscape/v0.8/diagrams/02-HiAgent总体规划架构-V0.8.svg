<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1580" viewBox="0 0 2400 1580"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1580" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">HiAgent 数据智能体总体规划架构</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">以专业 Agent 为服务主体，以治理后的数据与知识为基础，按需复用企业平台能力。</text><text x="48" y="1552.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1552.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">规划优化版 V0.8</text><rect x="48" y="186" width="2304" height="108" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><text x="72" y="213.5" dominant-baseline="central" text-anchor="start" font-size="24" fill="#2861B5" font-weight="700">业务使用与场景入口</text><text x="72" y="257.5" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">数据研发人员 / 分析人员 / 治理人员 / 运维人员 / 业务人员  →  数据研发、资产服务、治理运营、运行保障、分析决策</text><rect x="48" y="328" width="1768" height="796" rx="12" fill="#F7F9FD" stroke="#2861B5" stroke-width="1.3"/><text x="73" y="359.5" dominant-baseline="central" text-anchor="start" font-size="27" fill="#2861B5" font-weight="700">HiAgent 智能服务域｜专业 Agent 与资源引用视图</text><path d="M 900,295 L 900,323" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="72" y="397" width="1720" height="315" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="412" width="740" height="194" rx="12" fill="#F3F6FA" stroke="#D7E1ED" stroke-width="1.3"/><text x="105" y="437.0" dominant-baseline="central" text-anchor="start" font-size="22" fill="#2861B5" font-weight="700">数据生产类 · 5 种</text><rect x="102" y="471" width="135" height="113" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><text x="169.5" y="505.68" dominant-baseline="central" text-anchor="middle" font-size="18" fill="#2861B5" font-weight="700">数据需求分析</text><text x="169.5" y="532.32" dominant-baseline="central" text-anchor="middle" font-size="18" fill="#2861B5" font-weight="700">智能体</text><rect x="245" y="471" width="135" height="113" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><text x="312.5" y="505.68" dominant-baseline="central" text-anchor="middle" font-size="18" fill="#2861B5" font-weight="700">数据设计</text><text x="312.5" y="532.32" dominant-baseline="central" text-anchor="middle" font-size="18" fill="#2861B5" font-weight="700">智能体</text><rect x="388" y="471" width="135" height="113" rx="12" fill="#FFFFFF" 