<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1410" viewBox="0 0 2400 1410"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1410" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">在线任务数据流与结果核验</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">以新目标定位候选，查询真实事实，必要时调用平台执行，再组织可追溯成果。</text><text x="48" y="1382.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1382.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">治理与协同版 V0.8</text><rect x="48.0" y="210" width="435.2" height="260" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="232" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="246.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">任务输入</text><text x="73.0" y="351.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">问题与上下文</text><text x="73.0" y="383.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">用户身份与操作范围</text><path d="M 487.2,340.0 L 511.2,340.0" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="515.2" y="210" width="435.2" height="260" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="533.2" y="232" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="552.2" y="246.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">理解与消歧</text><text x="540.2" y="351.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">对象 / 口径 / 期间</text><text x="540.2" y="383.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">不明确时先确认</text><path d="M 954.4000000000001,340.0 L 978.4000000000001,340.0" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="982.4" y="210" width="435.2" height="260" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1000.4" y="232" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1019.4" y="246.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">检索候选</text><text x="1007.4" y="351.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">知识库与语义索引</text><text x="1007.4" y="383.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">返回对象标识与范围</text><path d="M 1421.6,340.0 L 1445.6,340.0" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1449.6" y="210" width="435.2" height="260" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1467.6" y="232" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1486.6" y="246.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">查询与执行</text><text x="1474.6" y="351.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">外部查询库 / 平台API</text><text x="1474.6" y="383.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">实际结果与执行证据</text><path d="M 1888.8,340.0 L 1912.8,340.0" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1916.8" y="210" width="435.2" height="260" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1934.8" y="232" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1953.8" y="246.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">组织成果</text><text x="1941.8" y="351.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">来源 / 范围 / 版本</text><text x="1941.8" y="383.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">缺口、限制与下一步</text><rect x="48" y="650" width="752" height="360" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="672" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="686.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">有效上下文复用</text><text x="73" y="841.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">已确认对象可以复用，减少无意义重复检索。</text><text x="73" y="873.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">未消除歧义，不擅自选择下级字段或码值。</text><rect x="824" y="650" width="752" height="360" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="842" y="672" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="861" y="686.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">事实来源分工</text><text x="849" y="841.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">当前资产事实：外部表字段与字典查询数据库。</text><text x="849" y="873.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">指标、血缘、运行和质量：按职责查询权威平台。</text><rect x="1600" y="650" width="752" height="360" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1618" y="672" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1637" y="686.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">反馈与异常</text><text x="1625" y="841.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">权限不足、缺失、过期与执行异常明确说明。</text><text x="1625" y="873.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">失败问题进入治理与真实任务回归，不编造事实。</text><rect x="48.0" y="1070" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="1092" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1106.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">核验原则</text><text x="73.0" y="1175.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">知识片段与模型记忆不代替实际记录或计算结果。</text><text x="73.0" y="1207.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">当前字典原值保留前导零，重复与冲突不静默合并。</text><rect x="1212.0" y="1070" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="1092" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1106.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">执行原则</text><text x="1237.0" y="1175.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">读取、草稿、调试、提交、发布分级控制。</text><text x="1237.0" y="1207.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">跨平台写入与生产操作由实际平台授权和确认。</text></g></svg>