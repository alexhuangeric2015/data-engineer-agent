<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1510" viewBox="0 0 2400 1510"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1510" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">指标服务与建设闭环</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">优先复用资产或指标平台，将定义、实现与消费统一，避免重复建设权威中心。</text><text x="48" y="1482.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1482.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">治理与协同版 V0.8</text><rect x="48.0" y="200" width="552.0" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="222" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="236.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">定义登记与归并</text><text x="73.0" y="326.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">名称 / 业务口径 / 维度</text><text x="73.0" y="358.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">同义、异义与责任归属</text><path d="M 604.0,315.0 L 628.0,315.0" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="632.0" y="200" width="552.0" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="650.0" y="222" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="669.0" y="236.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">确认审核与发布</text><text x="657.0" y="326.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">公式 / 范围 / 生效期</text><text x="657.0" y="358.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">审核状态与有效版本</text><path d="M 1188.0,315.0 L 1212.0,315.0" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1216.0" y="200" width="552.0" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1234.0" y="222" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1253.0" y="236.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">映射与验证</text><text x="1241.0" y="326.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">来源 / SQL / 已有API</text><text x="1241.0" y="358.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">粒度、约束与对账结果</text><path d="M 1772.0,315.0 L 1796.0,315.0" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1800.0" y="200" width="552.0" height="230" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1818.0" y="222" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1837.0" y="236.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">消费与演进</text><text x="1825.0" y="326.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">Agent / 报表 / 业务应用</text><text x="1825.0" y="358.03999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">使用反馈与变更影响</text><rect x="48" y="510" width="2304" height="390" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="70" y="547.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">指标模块的三类逻辑能力</text><rect x="70" y="595" width="740" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="617" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="107" y="631.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">指标定义管理</text><text x="95" y="739.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">统一标识、指标契约与版本</text><text x="95" y="770.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">保留业务责任、审核与生效范围</text><rect x="838" y="595" width="740" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="856" y="617" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="875" y="631.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">实现映射与核验</text><text x="863" y="739.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">一项定义可对应多个受控实现</text><text x="863" y="770.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">明确来源、适用范围与验证状态</text><rect x="1606" y="595" width="740" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1624" y="617" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1643" y="631.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">统一消费服务</text><text x="1631" y="739.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">检索、消歧、维度与参数约束</text><text x="1631" y="770.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">权限校验、结果来源与调用反馈</text><rect x="48.0" y="965" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="987" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1001.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">不建设的后果</text><text x="73.0" y="1070.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">同名不同义、重复定义、重复开发与结果不可比。</text><text x="73.0" y="1102.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">只登记指标名称而不约束实际消费，仍难统一口径。</text><rect x="1212.0" y="965" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="987" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1001.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">分层建设与收益</text><text x="1237.0" y="1070.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">先完善定义、版本和映射，优先已有API或受控SQL。</text><text x="1237.0" y="1102.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">语义计算引擎按条件扩展，不把MQL设为必选前提。</text></g></svg>