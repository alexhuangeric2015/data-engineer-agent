<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1580" viewBox="0 0 2400 1580"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1580" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">场景赋能与收益地图</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">按专业领域连接业务任务、建设依赖、交付成果与可观察收益。</text><text x="48" y="1552.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1552.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">治理与协同版 V0.8</text><rect x="48" y="190" width="752" height="1060" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="70" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">数据生产：需求到交付</text><rect x="70" y="290" width="708" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="312" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="107" y="326.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">需求复用与澄清</text><text x="95" y="434.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">检索相似指标、报表与模型</text><text x="95" y="465.53999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">形成结构化需求与待确认项</text><rect x="70" y="600" width="708" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="622" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="107" y="636.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">设计、开发与验证</text><text x="95" y="744.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">规则、模板、模型与代码协作</text><text x="95" y="775.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">形成设计、代码、用例和评审证据</text><rect x="70" y="955" width="708" height="240" rx="12" fill="#E6F5F0" stroke="#D7E1ED" stroke-width="1.3"/><rect x="88" y="977" width="5" height="27" rx="2" fill="#087E72" stroke="#087E72" stroke-width="1.3"/><text x="107" y="991.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#087E72" font-weight="700">预期业务收益</text><text x="95" y="1086.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">减少重复调研、规范返工与交接遗漏</text><text x="95" y="1118.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">观察：任务耗时、返工情况、成果采纳</text><rect x="824" y="190" width="752" height="1060" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="846" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">数据运营：资产与可靠性</text><rect x="846" y="290" width="708" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="864" y="312" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="883" y="326.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">资产查找与口径解释</text><text x="871" y="434.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">表字段、字典与码值查询</text><text x="871" y="465.53999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">形成正确对象、实际记录与解释</text><rect x="846" y="600" width="708" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="864" y="622" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="883" y="636.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">质量、影响与异常诊断</text><text x="871" y="744.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">查询口径、血缘、质量和运行事实</text><text x="871" y="775.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">形成证据、影响范围与处置建议</text><rect x="846" y="955" width="708" height="240" rx="12" fill="#E6F5F0" stroke="#D7E1ED" stroke-width="1.3"/><rect x="864" y="977" width="5" height="27" rx="2" fill="#087E72" stroke="#087E72" stroke-width="1.3"/><text x="883" y="991.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#087E72" font-weight="700">预期业务收益</text><text x="871" y="1086.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">减少查找与跨平台取证时间</text><text x="871" y="1118.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">观察：定位耗时、缺口识别、整改闭环</text><rect x="1600" y="190" width="752" height="1060" rx="12" fill="#F8FAFD" stroke="#D7E1ED" stroke-width="1.3"/><text x="1622" y="227.5" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2861B5" font-weight="700">数据分析：指标与洞察</text><rect x="1622" y="290" width="708" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1640" y="312" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1659" y="326.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">指标问数与多维分析</text><text x="1647" y="434.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">指标契约、维度与受控计算</text><text x="1647" y="465.53999999999996" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">形成可比口径与实际计算结果</text><rect x="1622" y="600" width="708" height="265" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1640" y="622" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1659" y="636.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">报告与业务解释</text><text x="1647" y="744.46" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">基于结果组织图表与分析</text><text x="1647" y="775.5400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">区分事实、假设与业务行动建议</text><rect x="1622" y="955" width="708" height="240" rx="12" fill="#E6F5F0" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1640" y="977" width="5" height="27" rx="2" fill="#087E72" stroke="#087E72" stroke-width="1.3"/><text x="1659" y="991.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#087E72" font-weight="700">预期业务收益</text><text x="1647" y="1086.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">减少反复取数与口径争议</text><text x="1647" y="1118.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">观察：口径一致、结果复核、业务采纳</text><rect x="48.0" y="1310" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="1332" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1346.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">收益验证</text><text x="73.0" y="1415.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">使用真实任务前后对比，兼顾正确性、效率和采纳。</text><text x="73.0" y="1447.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">目标在试点基线上确认，不使用外部案例倍数直接测算。</text><rect x="1212.0" y="1310" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="1332" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1346.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">当前与演进</text><text x="1237.0" y="1415.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">当前以资产服务和资料治理切入，其他为规划方向。</text><text x="1237.0" y="1447.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">各场景需要的语义、规则、平台接口与责任同步建设。</text></g></svg>