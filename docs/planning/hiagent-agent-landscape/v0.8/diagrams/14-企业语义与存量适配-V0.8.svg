<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1450" viewBox="0 0 2400 1450"><defs><marker id="2861B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2861B5"/></marker><marker id="087E72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E72"/></marker><marker id="7653A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7653A8"/></marker><marker id="60758C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758C"/></marker><marker id="163456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163456"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="2400" height="1450" rx="12" fill="#F3F6FA" stroke="#F3F6FA" stroke-width="1.3"/><rect x="0" y="0" width="2400" height="116" rx="12" fill="#163456" stroke="#163456" stroke-width="1.3"/><text x="48" y="29.0" dominant-baseline="central" text-anchor="start" font-size="15" fill="#AFC7E6" font-weight="700">HIAGENT  /  DATA INTELLIGENCE</text><text x="48" y="68.5" dominant-baseline="central" text-anchor="start" font-size="33" fill="#FFFFFF" font-weight="700">企业语义与存量适配架构</text><text x="48" y="145.0" dominant-baseline="central" text-anchor="start" font-size="18" fill="#60758C" font-weight="400">在存量资产之上建立逻辑映射，优先复用既有平台，不把统一改表作为智能体建设前提。</text><text x="48" y="1422.0" dominant-baseline="central" text-anchor="start" font-size="16" fill="#60758C" font-weight="400">规划讨论稿 V0.8  ·  2026.10.28  ·  绿色突出当前建设范围，其他为目标规划；不表示已投产或通过验收。</text><text x="2350" y="1422.0" dominant-baseline="central" text-anchor="end" font-size="15" fill="#60758C" font-weight="400">治理与协同版 V0.8</text><rect x="48" y="190" width="2304" height="160" rx="12" fill="#EBF2FC" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="212" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="226.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">业务表达与任务约束</text><text x="73" y="297.5" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">客户 / 机构 / 指标 / 客群 / 分析目标 → 术语与标准指标标识</text><rect x="48" y="490" width="752" height="260" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="512" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="526.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">业务语义</text><text x="73" y="631.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">术语 / 同义词 / 业务对象</text><text x="73" y="663.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">指标定义 / 粒度 / 适用维度</text><path d="M 1200,354 L 1200,420 L 424,420 L 424,486" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="824" y="490" width="752" height="260" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="842" y="512" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="861" y="526.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">模型与关联约束</text><text x="849" y="631.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">关联键 / 基数 / 去重规则</text><text x="849" y="663.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">时间有效期 / 跨域业务约束</text><path d="M 1200,354 L 1200,420 L 1200,420 L 1200,486" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="1600" y="490" width="752" height="260" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1618" y="512" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1637" y="526.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">实现与权威归属</text><text x="1625" y="631.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">SQL / API / 物理表字段</text><text x="1625" y="663.0400000000001" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">更新时点 / 来源版本 / 责任</text><path d="M 1200,354 L 1200,420 L 1976,420 L 1976,486" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="48" y="905" width="752" height="240" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66" y="927" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85" y="941.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">现有资产 / 指标平台</text><text x="73" y="1036.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">管理定义、模型与已有实现</text><text x="73" y="1068.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">补强语义、检索、版本与服务接口</text><rect x="824" y="905" width="752" height="240" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="842" y="927" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="861" y="941.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">数仓 / 计算引擎</text><text x="849" y="1036.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">保存实际数据并执行受控计算</text><text x="849" y="1068.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">质量和性能仍需原平台治理</text><rect x="1600" y="905" width="752" height="240" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1618" y="927" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1637" y="941.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">业务系统与规则来源</text><text x="1625" y="1036.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">业务记录、组织与历史约束</text><text x="1625" y="1068.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">业务责任人确认解释和适用范围</text><path d="M 424,754 L 424,901" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1200,754 L 1200,901" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><path d="M 1976,754 L 1976,901" fill="none" stroke="#2861B5" stroke-width="2" marker-end="url(#2861B5)"/><rect x="48.0" y="1200" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="66.0" y="1222" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="85.0" y="1236.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">主要难点</text><text x="73.0" y="1305.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">同名不同义、关联放大、历史有效期与多实现一致性。</text><text x="73.0" y="1337.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">先选限定域核验，逐步补强语义，不承诺自动解决全部缺陷。</text><rect x="1212.0" y="1200" width="1140.0" height="188" rx="12" fill="#FFFFFF" stroke="#D7E1ED" stroke-width="1.3"/><rect x="1230.0" y="1222" width="5" height="27" rx="2" fill="#2861B5" stroke="#2861B5" stroke-width="1.3"/><text x="1249.0" y="1236.0" dominant-baseline="central" text-anchor="start" font-size="25" fill="#2861B5" font-weight="700">存量治理原则</text><text x="1237.0" y="1305.96" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">优先保留存量结构；必要修复经原有变更流程。</text><text x="1237.0" y="1337.04" dominant-baseline="central" text-anchor="start" font-size="21" fill="#60758C" font-weight="400">业务关系、码值映射与真实加工血缘保持不同语义。</text></g></svg>